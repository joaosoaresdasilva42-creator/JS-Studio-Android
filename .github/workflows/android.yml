name: Gerar APK JS Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk JS-Studio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JS-Studio
          path: JS-Studio.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v1.0-${{ github.run_number }} >/dev/null 2>&1 || gh release create v1.0-${{ github.run_number }} JS-Studio.apk --title "JS Studio Android" --notes "Versao de teste Android"
